name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentproof
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://agentproof:agentproof@localhost:5432/agentproof
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ".:backend"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
