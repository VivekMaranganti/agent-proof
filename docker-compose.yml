services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentproof
      POSTGRES_USER: agentproof
      POSTGRES_PASSWORD: agentproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentproof -d agentproof"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://agentproof:agentproof@postgres:5432/agentproof
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://agentproof:agentproof@postgres:5432/agentproof
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://agentproof:agentproof@postgres:5432/agentproof
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m runner.worker

volumes:
  postgres_data:
  redis_data:
